name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install -r requirements-dev.txt -r packaging/requirements-build.txt

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build Bonsai.exe
        run: >-
          pyinstaller --noconfirm --onefile --windowed --name Bonsai --paths .
          --icon packaging/icon/bonsai.ico --add-data "bonsai/resources:bonsai/resources"
          packaging/bonsai_app.py

      - name: Check it starts
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:BONSAI_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "bonsai-config"
          $p = Start-Process -FilePath dist\Bonsai.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Write-Error "Bonsai.exe exited early (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id
          Write-Host "Bonsai.exe started and kept running"

      - uses: actions/upload-artifact@v4
        with:
          name: Bonsai-windows
          path: dist/Bonsai.exe
          retention-days: 30

  linux:
    # Built on an older Ubuntu so the binary also runs on older distributions (glibc 2.35+;
    # Debian 12 and 13 are fine).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: System libraries for Qt (and ffmpeg for the deep-test tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libfontconfig1 libdbus-1-3 ffmpeg

      - name: Install
        run: python -m pip install -r requirements-dev.txt -r packaging/requirements-build.txt

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build Bonsai
        run: >-
          pyinstaller --noconfirm --onefile --windowed --name Bonsai --paths .
          --icon packaging/icon/bonsai.ico --add-data "bonsai/resources:bonsai/resources"
          packaging/bonsai_app.py

      - name: Check it starts
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export BONSAI_CONFIG_DIR="$RUNNER_TEMP/bonsai-config"
          status=0; timeout 15 dist/Bonsai || status=$?
          if [ "$status" -ne 124 ]; then echo "Bonsai exited early (code $status)"; exit 1; fi
          echo "Bonsai started and kept running"

      - name: Package
        # A tarball keeps the executable bit (artifact zips drop it).
        run: |
          mkdir -p pkg
          cp dist/Bonsai pkg/
          cp packaging/linux/bonsai.desktop pkg/
          cp bonsai/resources/icon-256.png pkg/bonsai.png
          tar -czf Bonsai-linux-x86_64.tar.gz -C pkg Bonsai bonsai.desktop bonsai.png

      - uses: actions/upload-artifact@v4
        with:
          name: Bonsai-linux
          path: Bonsai-linux-x86_64.tar.gz
          retention-days: 30

  # A pushed v* tag also makes a draft GitHub release with both builds attached.
  # Drafts are private until published by hand.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('bonsai/__init__.py').read()).group(1))")
          if [ "$tag" != "$version" ]; then echo "Tag v$tag does not match __version__ $version"; exit 1; fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME}"
          cp artifacts/Bonsai-windows/Bonsai.exe "Bonsai-${v}-windows-x64.exe"
          cp artifacts/Bonsai-linux/Bonsai-linux-x86_64.tar.gz "Bonsai-${v}-linux-x86_64.tar.gz"
          gh release create "$v" --draft --title "Bonsai ${v#v}" --notes "Draft: notes to be written." \
            "Bonsai-${v}-windows-x64.exe" "Bonsai-${v}-linux-x86_64.tar.gz"
