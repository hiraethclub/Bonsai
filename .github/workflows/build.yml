name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install -r requirements-dev.txt -r packaging/requirements-build.txt

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build Bonsai.exe
        run: pyinstaller --noconfirm --onefile --windowed --name Bonsai --paths . packaging/bonsai_app.py

      - name: Check it starts
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:BONSAI_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "bonsai-config"
          $p = Start-Process -FilePath dist\Bonsai.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Write-Error "Bonsai.exe exited early (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id
          Write-Host "Bonsai.exe started and kept running"

      - uses: actions/upload-artifact@v4
        with:
          name: Bonsai-windows
          path: dist/Bonsai.exe
          retention-days: 30
